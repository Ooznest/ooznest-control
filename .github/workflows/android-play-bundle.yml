name: Build Android Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          npm install
          npm install -g cordova@13.0.0
          npm run cordova-sync
          cd cordova
          npx cordova-res android --skip-config
          cordova platform add android@15.1.0
      - name: Build unsigned release bundle
        run: npm run build-android-play
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Ooznest-Control-Play-unsigned
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
