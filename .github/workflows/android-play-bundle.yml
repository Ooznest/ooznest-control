name: Build Android Play bundle

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      ANDROID_UPLOAD_KEY_BASE64:
        required: true
      ANDROID_UPLOAD_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare upload signing
        env:
          ANDROID_UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const key = process.env.ANDROID_UPLOAD_KEY_BASE64;
          const password = process.env.ANDROID_UPLOAD_PASSWORD;
          if (!key || !password) throw new Error('Android upload-signing secrets are required');
          const keystore = path.join(process.env.RUNNER_TEMP, 'ooznest-control-upload.jks');
          fs.writeFileSync(keystore, Buffer.from(key, 'base64'), { mode: 0o600 });
          fs.writeFileSync('cordova/build.json', JSON.stringify({ android: { release: {
            keystore, storePassword: password, password,
            alias: 'ooznest-control-upload', keystoreType: 'jks', packageType: 'bundle'
          } } }), { mode: 0o600 });
          NODE
      - name: Install build dependencies
        run: |
          npm install
          npm install -g cordova@13.0.0
          npm run cordova-sync
          cd cordova
          npx cordova-res android --skip-config
          cordova platform add android@15.1.0
      - name: Build signed release bundle
        run: npm run build-android-play
      - name: Verify and name release bundle
        run: |
          BUNDLE=cordova/platforms/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$BUNDLE" > "$RUNNER_TEMP/android-signature-check.txt" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/android-signature-check.txt"
          VERSION=$(node -p "require('./package.json').version")
          mv "$BUNDLE" "$(dirname "$BUNDLE")/ooznest-control-${VERSION}-Play.aab"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Ooznest-Control-Play
          path: cordova/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove signing files
        if: always()
        run: rm -f cordova/build.json "$RUNNER_TEMP/ooznest-control-upload.jks"
