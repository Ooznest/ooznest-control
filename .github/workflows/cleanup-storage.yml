name: Clean up old releases and Actions runs

on:
  workflow_run:
    workflows: ["Cross-Platform Builds"]
    types: [completed]
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Keep five releases and seven days of completed runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/cleanup-storage.cjs
